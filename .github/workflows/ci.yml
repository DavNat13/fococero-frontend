name: Frontend Continuous Integration

on:
  pull_request:
    branches: ['develop', 'main']
  push:
    branches: ['develop', 'main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22']
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0

      - name: Auditoría de Tipos (TypeScript Estricto)
        run: npx tsc --noEmit

      - name: Ejecutar Pruebas y Cobertura de Código (Mínimo 60%)
        run: npx jest --coverage --passWithNoTests

      - name: Build
        run: npx expo export --platform web --output-dir dist || echo "Web build skipped (run expo build for native)"

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: coverage/
