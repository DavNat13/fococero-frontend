apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: fococero
data:
  init.sql: |
    CREATE DATABASE auth_db;
    CREATE DATABASE reportes_db;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fococero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ms-auth-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-auth-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: fococero_admin
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-storage
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: db-fococero
  namespace: fococero
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
