apiVersion: apps/v1
kind: Deployment
metadata:
  name: fococero-frontend
  namespace: fococero
  labels:
    app: fococero
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fococero
      tier: frontend
  template:
    metadata:
      labels:
        app: fococero
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: 486507079259.dkr.ecr.us-east-1.amazonaws.com/fococero-frontend:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # Apuntamos al servicio interno de K8s: http://nombre-servicio-k8s
            - name: EXPO_PUBLIC_API_GATEWAY_URL
              value: 'http://api-gateway'
            - name: EXPO_PUBLIC_ENVIRONMENT
              value: 'production'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
